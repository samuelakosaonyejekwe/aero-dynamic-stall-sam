theme: jekyll-theme-cayman
title: "UNISTALL — Dynamic-Stall Prediction"
# "calibrated ... and validated ...", not "validated against static and dynamic":
# the static polar is what the separation law is FITTED to, so comparing against
# it is a calibration check, not a prediction. README.md and report section 12.1
# both make that distinction; this line used to collapse it.
description: "Reduced-order Unified Indicial–Beddoes State-Space (UIBS) solver for a helicopter retreating blade (NACA 0012), calibrated to a published static polar and validated against held-out NASA dynamic-stall experiments."
author: Akosa Samuel Onyejekwe
lang: en-US

# _layouts/default.html calls {% seo %}, so the plugin must be declared here
# rather than relied on from the theme gem's own config.
plugins:
  - jekyll-seo-tag

# Link-preview card. assets/social-preview.jpg is the purpose-built 1280x640
# card; without this, {% seo %} fell back to a 512x512 square icon and every
# shared link rendered as a small thumbnail instead of the card.
# assets/social-preview.png is the same 1280x640 image, lossless. It is NOT
# referenced by the site: it is the master that GitHub's repository "Social
# preview" setting is uploaded from by hand. Kept so that upload is repeatable.
# Both files are GENERATED, by assets/make_social_preview.py, which reads the
# three numbers on the card from the published metrics. They used to be a
# hand-made image whose headline figures matched no result this study reports.
#
# assets/icon-512.png is likewise referenced by nothing in this repository --
# checked, not assumed. It is the 512x512 square that {% seo %} used to fall
# back to before the image: line below existed, and is kept only as the master
# for GitHub's own avatar/icon fields, which are also set by hand. If those are
# not used it can be deleted with no effect on the site.
image: /assets/social-preview.jpg
twitter:
  card: summary_large_image
